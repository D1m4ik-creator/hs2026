services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: apibd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: L7062006v.
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    networks:
      - app_network
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: todo:latest
    container_name: backend
    env_file:
      - ./api/api/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - db
      - redis
    expose:
      - "7000"
    ports:
      - "7000:7000"
    networks:
      - app_network

  frontend:
    build:
      context: ./ttkfront
      dockerfile: Dockerfile
    container_name: frontend
    environment:
      VITE_API_BASE_URL: http://localhost:7000
      VITE_WS_BASE_URL: ws://localhost:7000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - app_network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app_network

networks:
  app_network:
    name: app_network

volumes:
  pgdata:
